<div class="game-item-container"
     [appShowDetailsOnHover]="'Cyberpunk is a science-fiction subgenre set in dystopian futures characterized by advanced technology, cybernetics, and societal collapse.'">
  <h3>{{ gameItem?.title | titlecase }}</h3>
  <h4>{{ gameItem?.genre | uppercase }}</h4>
  <p>Developer: {{ gameItem?.developer }}</p>
  <p>Release Date: {{ gameItem?.releaseDate | date: 'mediumDate' }}</p>
  <img [src]="gameItem?.URL" width="200" height="300" alt="{{ gameItem?.title }}">
  <button type="button" (click)="onEdit()">Edit</button>
  <button type="button" (click)="onDelete(gameItem?.id)">Delete</button>
</div>
