<!-- src/app/game-list-item/game-list-item.component.html -->
<div class="game-item">
  <h3>{{ gameItem?.title }}</h3>
  <img [src]="gameItem?.image" alt="{{ gameItem?.title }}" class="game-image">
  <p>Genre: {{ gameItem?.genre }}</p>
  <p>Developer: {{ gameItem?.developer }}</p>
  <p>Release Date: {{ gameItem?.releaseDate }}</p>
  <p>Rating: {{ gameItem?.rating }}</p>
</div>
