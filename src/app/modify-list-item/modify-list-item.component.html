<form [formGroup]="gameForm" (ngSubmit)="onSubmit()">
  <div class="form-group">
    <label for="id">ID</label>
    <input type="number" id="id" formControlName="id" appHighlightOnFocus="lightblue" />
    <div *ngIf="gameForm.controls['id'].hasError('positiveNumber')">
      ID must be a positive number.
    </div>
    <div *ngIf="gameForm.controls['id'].hasError('unique')">
      ID must be unique.
    </div>
  </div>

  <div class="form-group">
    <label for="title">Title</label>
    <input type="text" id="title" formControlName="title" appHighlightOnFocus="lightgreen" />
    <div *ngIf="gameForm.controls['title'].hasError('noSpecialChars')">
      Title cannot contain special characters.
    </div>
    <div *ngIf="gameForm.controls['title'].hasError('unique')">
      Title must be unique.
    </div>
  </div>

  <div class="form-group">
    <label for="genre">Genre</label>
    <input type="text" id="genre" formControlName="genre" appHighlightOnFocus="lightyellow" />
  </div>

  <div class="form-group">
    <label for="developer">Developer</label>
    <input type="text" id="developer" formControlName="developer" appHighlightOnFocus="lightcoral" />
  </div>

  <div class="form-group">
    <label for="releaseDate">Release Date</label>
    <input type="date" id="releaseDate" formControlName="releaseDate" appHighlightOnFocus="lightpink" />
  </div>

  <div class="form-group">
    <label for="rating">Rating</label>
    <input type="text" id="rating" formControlName="rating" placeholder="e.g., 9.5" appHighlightOnFocus="lightcyan" />
  </div>

  <div class="form-group">
    <label for="URL">Image URL</label>
    <input type="text" id="URL" formControlName="URL" placeholder="https://" appHighlightOnFocus="lightgray" />
  </div>

  <button type="submit" [disabled]="!gameForm.valid">
    {{ isEditMode ? 'Update' : 'Add' }} Game
  </button>

  <button type="button" (click)="resetForm()">Reset</button>
  <button type="button" (click)="onDelete()" *ngIf="isEditMode">Delete</button>
  <button type="button" (click)="navigateToGameList()">Back to List</button>
</form>
