<div
  class="game-container"

  *ngFor="let game of gameList"
  [appHoverHighlight]="'lightblue'"
>
  <h2>{{ game.title | titlecase }}</h2>
  <p>ID: {{ game.id }}</p>
  <p>Genre: {{ game.genre | uppercase }}</p>
  <p>Developer: {{ game.developer }}</p>
  <p>Release Date: {{ game.releaseDate | date: 'mediumDate' }}</p>
  <p [class]="game.rating | ratingColor">Rating: {{ game.rating }}</p>
</div>
