<div class="game-container" *ngFor="let game of gameList">
  <h2>{{ game.title | titlecase }}</h2>
  <p>ID: {{ game.id }}</p>
  <p>Genre: {{ game.genre | uppercase }}</p>
  <p>Developer: {{ game.developer }}</p>
  <p>Release Date: {{ game.releaseDate | date: 'mediumDate' }}</p>
  <p>Rating: {{ game.rating }}</p>
</div>

<div *ngIf="errorMessage" class="error">
  {{ errorMessage }}
</div>
